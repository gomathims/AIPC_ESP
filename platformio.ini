; PlatformIO Project Configuration File — ESP8266 3-phase V/I/P/E metering device.
;
; Ported from the ESP32-C3 "EVIQ-3PH / VSMR" WiFi stack. The WiFi web portal,
; parallel SoftAP, event log, EVIQtech cloud (ThingsBoard MQTT) and OTA are all
; re-implemented against the ESP8266 Arduino core (sync web server, LittleFS-backed
; settings, BearSSL, ESP8266 Update). Metering values (voltage/current/power/energy
; for L1/L2/L3) arrive over UART from an STM32 front-end.

[env:huzzah]
platform = espressif8266
board = huzzah
framework = arduino
upload_port = COM6
upload_speed = 921600
monitor_speed = 115200

; LittleFS holds runtime config (/nvs_*.json) + the event log (/events.bin).
; 4m1m = 3 MB program region (leaves room for OTA) + 1 MB filesystem.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

; deep (not deep+): deep+'s preprocessor pass mis-evaluates WebSockets.h and
; drops ESP8266WiFi from that library's include path.
lib_ldf_mode = deep
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.1
	links2004/WebSockets@^2.6.1

; Pre-build: regenerate src/web_content.h + src/web_mappings.h from data/.
extra_scripts =
	pre:webgen.py

build_flags =
	-D FIRMWARE_MAJOR=1
	-D FIRMWARE_MINOR=0
	-D FIRMWARE_PATCH=0
	-D CLOUD_DEVICE_TYPE=\"EVIQ3PH_ESP\"
	-D THINGSBOARD_SERVER_URL=\"https://iot.eviqtech.com\"
	-D THINGSBOARD_REGISTER_URI=\"/api/device/registerDevice\"
	-D THINGSBOARD_MQTT=\"iot.eviqtech.com\"
	; PubSubClient buffer: fw_* shared attrs + telemetry need headroom.
	-D MQTT_MAX_PACKET_SIZE=1024
